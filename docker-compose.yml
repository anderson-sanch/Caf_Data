services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cafdata
      POSTGRES_USER: cafdata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafdata -d cafdata"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://cafdata:${POSTGRES_PASSWORD:-change_this_password}@database:5432/cafdata?schema=public
      PORT: 3000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment}
      CORS_ORIGIN: http://localhost
    depends_on:
      database:
        condition: service_healthy
    command: sh -c "npm run prisma:db:push && node dist/main"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
